spring.application.name=knot-event-management

# ===== MySQL Datasource =====
spring.datasource.url=jdbc:mysql://localhost:3306/knot_database?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Server =====
server.port=8082

# ===== JWT =====
jwt.secret=knotSuperSecretKeyForJwtSigningChangeThisInProduction123456
jwt.expiration.ms=86400000

# ===== CORS (frontend dev server) =====
app.cors.allowed-origins=http://localhost:5173
